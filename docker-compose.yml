services:
  node:
    build:
      context: .
      target: development
    tty: true
    volumes:
      - .:/usr/src/app
    ports:
      - 3124:3124
    depends_on:
      - mysql
      - redis
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data     
  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - mysql_storage:/var/lib/mysql
    ports:
      - 3306:3306

volumes:
  mysql_storage:
  redis_data:
